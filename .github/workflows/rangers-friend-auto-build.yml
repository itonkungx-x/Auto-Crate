name: Rangers Friend Auto v0.3 APK
on:
  push:
    branches: [rangers-friend-auto-build]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Extract version 0.3 Android project
        run: base64 -d .build/rangers_v03_source.tar.xz.b64 | tar -xJf -
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build APK
        run: gradle --no-daemon -p LINE_Rangers_Friend_Auto :app:assembleDebug
      - name: Stage APK
        run: cp LINE_Rangers_Friend_Auto/app/build/outputs/apk/debug/app-debug.apk LINE_Rangers_Friend_Auto_v0.3.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LINE_Rangers_Friend_Auto_v0.3
          path: LINE_Rangers_Friend_Auto_v0.3.apk
          if-no-files-found: error
