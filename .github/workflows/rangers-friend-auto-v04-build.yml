        shell: bash
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build debug APK
        run: gradle --no-daemon -p rangers-friend-auto :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: LINE-Rangers-Friend-Auto-v0.4-APK
          path: rangers-friend-auto/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
