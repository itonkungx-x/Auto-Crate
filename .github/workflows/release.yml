name: Build and Release Auto-Crate

on:
  push:
    branches: [main]
    paths:
      - 'crate-auto-reward/**'
      - 'RELEASE_NOTES.md'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-crate-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Build Fabric mod
        run: gradle -p crate-auto-reward clean build --no-daemon --stacktrace
      - name: Package release and checksum
        id: package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^mod_version=//p' crate-auto-reward/gradle.properties)"
          JAR="crate-auto-reward/build/libs/crate-auto-reward-26.3-${VERSION}.jar"
          test -s "$JAR"
          unzip -t "$JAR" >/dev/null
          unzip -p "$JAR" fabric.mod.json | grep -q '"crateautoreward"'
          sha256sum "$JAR" > "${JAR}.sha256"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "jar=$JAR" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.package.outputs.tag }}
          JAR: ${{ steps.package.outputs.jar }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" "${JAR}.sha256" --clobber
          else
            gh release create "$TAG" "$JAR" "${JAR}.sha256" \
              --title "Auto-Crate $TAG" --notes-file RELEASE_NOTES.md --latest
          fi
      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: Auto-Crate-Fabric-26.3
          path: |
            crate-auto-reward/build/libs/crate-auto-reward-26.3-*.jar
            crate-auto-reward/build/libs/crate-auto-reward-26.3-*.jar.sha256
